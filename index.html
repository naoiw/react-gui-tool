<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="シリアル波形表示ツール - Web Serial API で COM ポートと通信し Recharts で波形表示" />
    <title>React GUI Tool</title>
    <script>
      // Apply the saved theme before React/CSS paints. No saved value => light.
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('react-gui-tool-theme') === 'dark' ? 'dark' : 'light';
      } catch (_) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
